[colors]
border-salmon = #ffa07a
light-red = #d95b5b
light-green = #249824
light-purple = #a44ba0
light = #eee

bg-alt = #202020

lime = #8fce00

slate-lime = #649000
dark-red = #311
dark-green = #131
dark-purple = #201134
dark-salmon = #19100c
gray = #999
dark = #111
fav-purple = #6633ff

[global/wm]
margin-top = 0
margin-bottom = 0

[bar/top]
;width = 100%
width = 100%
height = 15pt
bottom = true
offset-x  = 0
offset-y  = 0
override-redirect = false

background = ${colors.dark}
foreground = ${colors.light}

line-size = 2
seperator = "     "
border-bottom-size = 5
border-bottom-color = ${colors.dark}
border-top-size = 5
border-top-color = ${colors.dark}

spacing = 0
padding-left = 1
padding-right = 0
module-margin-left = 0
module-margin-right = 0

;font-0 = Iosevka;2
font-0 = Iosevka Nerd Font;2

tray-position = right
tray-padding = 1
tray-transparent = true
tray-background = #000000

modules-left = menu i3
modules-center = date vpn
modules-right = uptime cpu memory hostname

cursor-click = pointer
cursor-scroll = ns-resize

; enable-ipc = true

[module/i3]
type = internal/i3

strip-wsnumbers = true

label-focused = " [%name%] "
label-focused-foreground = #ffd966
label-focused-padding =
label-unfocused = " {%name%} "
label-unfocused-padding = 0
label-unfocused-foreground = #666

label-urgent = " [%name%] "
label-urgent-foreground = ${colors.light-red}
label-urgent-padding = 1

label-visible = " (%name%) "
label-visible-foreground = #666
label-visible-padding = 0

[module/uptime]
type = custom/script
exec = uptime -p | sed 's/^up //'
interval = 60
format-prefix = "  "
format-prefix-foreground = ${colors.light-red}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "   "
format-prefix-foreground = #3d85c6
label = "%percentage%% "

[module/memory]
type = internal/memory
interval = 2
format-prefix = "  "
format-prefix-foreground = ${colors.light-green}
label = "%percentage_used%% "

[module/vpn]
type = internal/network
interval = 2
interface = tun0
format-prefix = " "
format-prefix-foreground = ${colors.light-purple}
format-connected =   <label-connected>
format-connected-foreground = ${colors.lime}
label-connected = "%local_ip% (VPN On)"
label-disconnected = "VPN Off"
label-disconnected-foreground = ${colors.light-red}

[module/date]
type = internal/date
interval = 5

date =
date-alt = " %a %d %b %Y "

time = " %H:%M "
time-alt = " %H:%M "

label = "%date%%time% "
label-size = 10pt

format-prefix = " "
format-prefix-foreground = #fff

[module/hostname]
type = custom/script

exec = echo "🖥 $(hostname)"
interval = 60

format-prefix = " "
format-prefix-foreground = #ffd966

[module/menu]
type = custom/text

content = "  "
content-foreground = #ffd966
;click-left = ~/.config/polybar/scripts/todo.sh ; you can configure this to your preference

;[module/mail]
;type = custom/script
;interval = 1200
;format = " <label> "
;format-prefix = "✉ "
;format-prefix-foreground = ${colors.light-red}
;exec = ~/.config/polybar/scripts/mail.sh
;exec-if = "ping -q -w 2 -c 1 8.8.8.8 > /dev/null"

; vim:ft=dosini